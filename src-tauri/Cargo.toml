[package]
name = "wifiary"
version = "0.0.1"
description = "WiFiary - a friendly Wi-Fi GUI for iwd (iwctl)"
authors = ["WiFiary contributors"]
edition = "2021"
default-run = "wifiary"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
clap = { version = "4.5.23", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wait-timeout = "0.2"

[[bin]]
name = "wifiary"
path = "src/main.rs"

[[bin]]
name = "wifiary-helper"
path = "src/bin/wifiary-helper.rs"
